<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>WonderPark - Mijn Profiel</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .profile-wrapper { max-width: 850px; margin: 120px auto 40px auto; padding: 20px; }
        .profile-card { background: #0f111e; border: 2px solid rgba(212,175,55,0.3); border-radius: 12px; padding: 40px; text-align: center; position: relative; box-shadow: 0 8px 30px rgba(0,0,0,0.5); }
        .avatar-box { width: 100px; height: 100px; background: #15182b; margin: 0 auto 20px auto; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 40px; border: 2px solid #d4af37; }
        .profile-name { font-size: 28px; font-weight: 700; color: #fff; margin-bottom: 5px; }
        
        /* Rank Badges Styles */
        .rank-badge { display: inline-block; padding: 5px 14px; border-radius: 6px; font-weight: 700; font-size: 14px; text-transform: uppercase; margin-bottom: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); color: #fff; }
        
        .stats-cluster { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 10px; }
        .stat-box { background: #15182b; padding: 20px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05); }
        .stat-box h5 { text-transform: uppercase; color: #7e84a3; font-size: 12px; letter-spacing: 1px; margin-bottom: 5px; }
        .stat-box p { font-size: 22px; font-weight: bold; color: #fff; }

        /* PINS PLATFORM EXHIBITION DISPLAY */
        .pins-showcase-title { font-size: 18px; color: #d4af37; margin: 35px 0 15px 0; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 8px; text-align: left; }
        .pins-grid-display { display: flex; gap: 15px; flex-wrap: wrap; justify-content: flex-start; padding: 10px 0; }
        
        /* KEYFRAME FX ENGINES FOR DISPLAY */
        @keyframes masterGlowPulse { 0%, 100% { box-shadow: 0 0 4px var(--g-color); } 50% { box-shadow: 0 0 18px var(--g-color); } }
        @keyframes masterSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes masterRainbow { 0% { filter: hue-rotate(0deg); } 100% { filter: hue-rotate(360deg); } }
        @keyframes masterFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

        .pin-wrapper-container { position: relative; display: inline-block; }
        .pin-element { width: 50px; height: 50px; border-radius: 50%; background: #15182b; border: 2px solid rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: help; }
        .p-fx-glow { animation: masterGlowPulse 2s infinite ease-in-out; }
        .p-fx-spin { animation: masterSpin 6s linear infinite; }
        .p-fx-rainbow { animation: masterRainbow 4s linear infinite; }
        .p-fx-float { animation: masterFloat 2.5s infinite ease-in-out; }

        /* Custom Tooltip on Hover */
        .pin-element:hover + .pin-tooltip { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }
        .pin-tooltip { position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%) translateY(10px); background: #07080e; border: 1px solid #d4af37; padding: 10px 14px; border-radius: 6px; font-size: 12px; color: #fff; width: 180px; text-align: center; pointer-events: none; opacity: 0; transition: all 0.2s ease; z-index: 99; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .pin-tooltip b { display: block; color: #d4af37; font-size: 13px; margin-bottom: 2px; }

        /* Hideable Drawer Module */
        .settings-toggle-btn { position: absolute; top: 15px; right: 15px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #7e84a3; width: 32px; height: 32px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; }
        .settings-toggle-btn:hover { color: #fff; background: rgba(212,175,55,0.2); border-color: #d4af37; }
        .settings-drawer { display: none; background: #090a12; border: 1px solid rgba(212,175,55,0.15); border-radius: 8px; padding: 25px; margin-top: 30px; text-align: left; animation: slideDown 0.3s ease; }
        @keyframes slideDown { from { opacity:0; transform:translateY(-10px); } to { opacity:1; transform:translateY(0); } }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">Wonder<span>Park</span></a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="attracties.html">Attracties</a></li>
                <li><a href="tijden.html">Tijden</a></li>
                <li><a href="vacatures.html">Vacatures</a></li>
                <li><a href="staff.html">Staff</a></li>
                <li><a href="highscores.html">Highscores</a></li>
                <li><a href="tickets.html">Support</a></li>
                <li><a href="webshop.html" class="shop-btn">Webshop</a></li>
                <li id="nav-auth"></li>
            </ul>
        </div>
    </nav>

    <div class="profile-wrapper">
        <div class="profile-card animated-fade-in">
            <button class="settings-toggle-btn" onclick="toggleSettingsDrawer()">⚙️</button>
            
            <div class="avatar-box">👤</div>
            <div class="profile-name" id="profile-username">Minecraft_Speler</div>
            <div id="rank-badge-container"></div>

            <div class="stats-cluster">
                <div class="stat-box"><h5>In-game Saldo</h5><p style="color: #f1c40f;" id="profile-coins">0 Coins</p></div>
                <div class="stat-box"><h5>Account Beveiliging</h5><p style="color: #2ecc71; font-size:16px; margin-top:5px;">✓ Verified</p></div>
            </div>

            <div class="pins-showcase-title">🎖️ Mijn Behaalde Spelden & Pins</div>
            <div class="pins-grid-display" id="profile-pins-zone">
                </div>

            <div class="settings-drawer" id="settings-panel">
                <h4 style="color:var(--gold); margin-bottom:15px; font-size:16px;">🔒 Accountinstellingen Wijzigen</h4>
                <form onsubmit="updateProfilePassword(event)">
                    <div class="form-group" style="display:flex; flex-direction:column; gap:6px; margin-bottom:15px;">
                        <label style="font-size:12px; color:#7e84a3; text-transform:uppercase;">Nieuw Wachtwoord:</label>
                        <input type="password" id="profile-new-pass" required style="background:#15182b; border:1px solid rgba(255,255,255,0.08); padding:12px; border-radius:6px; color:#fff;">
                    </div>
                    <button type="submit" class="shop-btn" style="border:none; width:100%; padding:12px; cursor:pointer;">Wachtwoord Beveiligen</button>
                </form>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>
    <script src="script.js"></script>
    
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            if(localStorage.getItem('wp_is_logged_in') !== 'true') {
                window.location.href = 'index.html';
                return;
            }

            const username = localStorage.getItem('wp_username');
            document.getElementById('profile-username').innerText = username;

            // Haal database profielvariabelen op
            let profileData = JSON.parse(localStorage.getItem(`wp_profile_${username}`)) || { rank: "Speler", coins: "500" };
            document.getElementById('profile-coins').innerText = `🪙 ${profileData.coins} Coins`;

            // --- RANKS COMPILER ---
            const defaultRanks = {
                "Speler": { text: "Speler", color1: "#7e84a3", mode: "solid", emoji: "" },
                "VIP": { text: "VIP", color1: "#f1c40f", mode: "solid", emoji: "⭐" },
                "MEGA-VIP": { text: "MEGA-VIP", color1: "#2ecc71", mode: "solid", emoji: "💎" },
                "Bouwer": { text: "Bouwer", color1: "#00f0ff", mode: "solid", emoji: "🛠️" },
                "Moderator": { text: "Moderator", color1: "#e74c3c", mode: "solid", emoji: "🛡️" }
            };
            const customRanks = JSON.parse(localStorage.getItem("wp_custom_ranks")) || {};
            const allRanks = { ...defaultRanks, ...customRanks };
            const rankConfig = allRanks[profileData.rank || "Speler"] || defaultRanks["Speler"];

            const badgeContainer = document.getElementById("rank-badge-container");
            const badge = document.createElement("span");
            badge.className = "rank-badge";
            badge.innerText = `${rankConfig.emoji ? rankConfig.emoji + ' ' : ''}${rankConfig.text}`;
            if(rankConfig.mode === 'gradient') {
                badge.style.background = `linear-gradient(135deg, ${rankConfig.color1}, ${rankConfig.color2})`;
            } else {
                badge.style.background = rankConfig.color1;
            }
            badge.style.color = "#000";
            badgeContainer.appendChild(badge);

            // --- DYNAMIC PINS EXHIBITION LOADER ---
            const defaultPins = {
                "first-join": { title: "Eerste Bezoek", desc: "Arriveer voor de allereerste keer in WonderPark", emoji: "🎟️", fx: "float", color: "#00f0ff" },
                "rich-beast": { title: "Zakenmagnaat", desc: "Bezit meer dan 10.000 in-game munten", emoji: "👑", fx: "glow", color: "#d4af37" }
            };
            const customPins = JSON.parse(localStorage.getItem("wp_custom_pins")) || {};
            const allPins = { ...defaultPins, ...customPins };

            let ownedPinsKeys = JSON.parse(localStorage.getItem(`wp_player_pins_${username}`)) || ["first-join"]; // Eerste bezoek default toegekend
            const pinsZone = document.getElementById("profile-pins-zone");
            pinsZone.innerHTML = ownedPinsKeys.length === 0 ? "<p style='color:#7e84a3; font-size:13px;'>Nog geen verzamelspelden verdiend.</p>" : "";

            ownedPinsKeys.forEach(k => {
                const p = allPins[k];
                if(p) {
                    pinsZone.innerHTML += `
                        <div class="pin-wrapper-container">
                            <div class="pin-element p-fx-${p.fx}" style="--g-color: ${p.color}; border-color: ${p.color};">${p.emoji}</div>
                            <div class="pin-tooltip"><b>${p.title}</b>${p.desc}</div>
                        </div>`;
                }
            });
        });

        function toggleSettingsDrawer() {
            const el = document.getElementById("settings-panel");
            el.style.display = (el.style.display === "block") ? "none" : "block";
        }

        function updateProfilePassword(e) {
            e.preventDefault();
            localStorage.setItem('wp_password', document.getElementById("profile-new-pass").value);
            if(typeof showToast === 'function') showToast("🔒 Wachtwoord succesvol bijgewerkt!", "success");
            document.getElementById("profile-new-pass").value = "";
            toggleSettingsDrawer();
        }
    </script>
</body>
</html>
