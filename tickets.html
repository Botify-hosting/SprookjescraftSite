<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8"><title>WonderPark - Support</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar"><div class="nav-container"><a href="index.html" class="logo">Wonder<span>Park</span></a><ul class="nav-links"><li><a href="index.html">Home</a></li><li><a href="attracties.html">Attracties</a></li><li><a href="tijden.html">Tijden</a></li><li><a href="vacatures.html">Vacatures</a></li><li><a href="staff.html">Staff</a></li><li><a href="highscores.html">Highscores</a></li><li><a href="tickets.html" class="active">Tickets</a></li><li><a href="webshop.html" class="shop-btn">Webshop</a></li><li id="nav-auth"></li></ul></div></nav>

    <main class="container animated-fade-in">
        <h2 class="section-title">Support Ticket Aanmaken</h2>
        
        <div id="ticket-auth-warning" style="background-color:#e74c3c; padding:20px; border-radius:6px; font-weight:bold; margin-bottom:20px;">
            ⚠️ Je moet ingelogd zijn met je WonderPark account om een support ticket in te dienen!
        </div>

        <div class="form-box" id="ticket-form-box" style="display:none;">
            <form onsubmit="handleTicket(event)">
                <div class="form-group"><label>Onderwerp / Categorie:</label><select><option>Attractie Storing / Bug report</option><option>Webshop Betaling Probleem</option><option>Speler Rapporteren</option><option>Overige Vraag</option></select></div>
                <div class="form-group"><label>Beschrijf je probleem uitgebreid:</label><textarea rows="6" required placeholder="Typ hier je bericht naar de staff..."></textarea></div>
                <button type="submit" class="submit-btn">Ticket Openen</button>
            </form>
        </div>
    </main>

    <div id="auth-modal" class="modal"><div class="modal-content"><span class="close-btn" onclick="closeAuthModal()">&times;</span><div class="auth-tabs"><button id="tab-login" class="active" onclick="toggleAuthTab('login')">Inloggen</button><button id="tab-register" onclick="toggleAuthTab('register')">Registreren</button></div><form id="login-form" onsubmit="handleLogin(event)"><input type="text" id="login-user" placeholder="Minecraft Naam" required><input type="password" id="login-pass" placeholder="Wachtwoord" required><button type="submit" class="submit-btn">Log in</button></form><form id="register-form" onsubmit="handleRegister(event)" style="display:none;"><input type="text" id="reg-user" placeholder="Minecraft Naam" required><input type="email" id="reg-email" placeholder="E-mail" required><input type="password" id="reg-pass" placeholder="Wachtwoord" required><button type="submit" class="submit-btn">Registreer</button></form></div></div>
    <div id="toast-container"></div>
    <script src="script.js"> </script>
    <script>
        // Extra check specifiek voor de ticket-beveiliging
        document.addEventListener("DOMContentLoaded", () => {
            if(localStorage.getItem('wp_is_logged_in') === 'true') {
                document.getElementById('ticket-auth-warning').style.display = 'none';
                document.getElementById('ticket-form-box').style.display = 'block';
            }
        });
    </script>
</body>
</html>
